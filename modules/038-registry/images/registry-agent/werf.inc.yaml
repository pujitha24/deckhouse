---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
fromImage: common/src-artifact
final: false
git:
  - add: /{{ $.ModulePath }}modules/{{ $.ModulePriority }}-{{ $.ModuleName }}/images/{{ $.ImageName }}/src
    to: /src
    excludePaths:
      - '**/*.md'
    stageDependencies:
      install:
        - go.mod
        - go.sum
        - '**/*.go'
  # The API types are shared with the controller and the storage syncer, so all three
  # link the same package instead of keeping three copies in step.
  - add: /{{ $.ModulePath }}go_lib/registry
    to: /go_lib/registry
    includePaths:
      - '**/*.go'
      - '**/*.mod'
      - '**/*.sum'
    stageDependencies:
      install:
        - '**/*.go'
        - go.mod
        - go.sum
shell:
  install:
    - set -e
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
from: {{ index $.Images "builder/golang" }}
final: false
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /src
    to: /src
    before: install
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-src-artifact"
    add: /go_lib/registry
    to: /go_lib/registry
    before: install
mount:
{{ include "mount points for golang builds" . }}
secrets:
  - id: GOPROXY
    value: "{{ $.GOPROXY }}"
shell:
  install:
    - cd /src
    - export GOPROXY=$(cat /run/secrets/GOPROXY)
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test ./...
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /registry-agent ./cmd
    - chmod 0755 /registry-agent
---
image: "{{ $.ModuleName }}/{{ $.ImageName }}"
fromImage: common/distroless
import:
  - image: "{{ $.ModuleName }}/{{ $.ImageName }}-artifact"
    add: /registry-agent
    to: /registry-agent
    before: setup
imageSpec:
  config:
    entrypoint: ["/registry-agent"]
