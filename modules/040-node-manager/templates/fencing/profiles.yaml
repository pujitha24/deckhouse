{{/*
The four reaction profiles a NodeGroup can select through spec.fencing.profile.

They are rendered unconditionally: a NodeGroup that enables fencing must find its
profile already present, otherwise the agent would start before the object exists.
The objects are small and inert while no NodeGroup references them.

Timings come from the fencing SLA design. The CRD enforces the relations between
them (probeTimeout < probeInterval, heartbeat < ttl, apiTimeout < ttl,
interval <= maxInterval, feedInterval < timeout), so a typo here is rejected on apply.
*/}}
---
apiVersion: node-manager.deckhouse.io/v1alpha1
kind: FencingSLAProfile
metadata:
  name: critical
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing")) | nindent 2 }}
spec:
  memberlist:
    probeInterval: 100ms
    probeTimeout: 50ms
    suspicionMult: 2
    suspicionMaxTimeoutMult: 6
    awarenessMaxMultiplier: 8
    indirectChecks: 4
    gossipInterval: 100ms
    retransmitMult: 4
    gossipToTheDeadTime: 2s
  fallback:
    heartbeat: 250ms
    apiTimeout: 500ms
    ttl: 1s
  rejoin:
    interval: 500ms
    maxInterval: 3s
  watchdog:
    feedInterval: 250ms
    timeout: 3s
  evacuation:
    delay: 1200ms
---
apiVersion: node-manager.deckhouse.io/v1alpha1
kind: FencingSLAProfile
metadata:
  name: medium
  {{- include "helm_lib_module_labels" (list . (dict "app" "fencing")) | nindent 2 }}
spec:
  memberlist:
    probeInterval: 300ms
    probeTimeout: 120ms
    suspicionMult: 3
    suspicionMaxTimeoutMult: 6
    awarenessMaxMultiplier: 8
    indirectChecks: 3
    gossipInterval: 200ms
    retransmitMult: 4
    gossipToTheDeadTime: 5s
  fallback:
    heartbeat: 1s
    apiTimeout: 2s
    ttl: 4s
  rejoin:
    interval: 1s
    maxInterval: 10s
  watchdog:
    feedInterval: 1s
    timeout: 10s
  evacuation:
    delay: 6s
---
apiVersion: node-manager.deckhouse.io/v1alpha1
