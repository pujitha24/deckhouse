    suspicionMult: 4
    suspicionMaxTimeoutMult: 6
    awarenessMaxMultiplier: 8
    indirectChecks: 3
    gossipInterval: 300ms
    retransmitMult: 4
    gossipToTheDeadTime: 10s
  fallback:
    heartbeat: 2s
    apiTimeout: 5s
    ttl: 10s
  rejoin:
    interval: 2s
    maxInterval: 20s
  watchdog:
    feedInterval: 2s
    timeout: 30s
  evacuation:
    delay: 20s
---
apiVersion: node-manager.deckhouse.io/v1alpha1
kind: FencingSLAProfile
