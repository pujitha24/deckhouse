    suspicionMult: 4
    suspicionMaxTimeoutMult: 6
    awarenessMaxMultiplier: 8
    indirectChecks: 3
    gossipInterval: 500ms
    retransmitMult: 4
    gossipToTheDeadTime: 20s
  fallback:
    heartbeat: 5s
    apiTimeout: 10s
    ttl: 20s
  rejoin:
    interval: 5s
    maxInterval: 30s
  watchdog:
    feedInterval: 5s
    timeout: 60s
  evacuation:
    delay: 45s
